<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <h2>Change la couleur de fond !</h2>
    <p>Passe la souris sur les carrés colorés</p>
    <table style="width:300px;height:100px">
        <tr>
            <td style="background-color:Khaki" onmouseover="document.body.style.backgroundColor = this.style.backgroundColor"
                onmouseout="document.body.table = 'transparent'">
            </td>
            <td style="background-color:PaleGreen" onmouseover="document.body.style.backgroundColor = this.style.backgroundColor"
                onmouseout="document.body.table = 'transparent'">
            </td>
            <td style="background-color:Silver" onmouseover="document.body.style.backgroundColor = this.style.backgroundColor"
                onmouseout="document.body.table = 'transparent'">
            </td>
        </tr>
    </table>
</body>

</html>
