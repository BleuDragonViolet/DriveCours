<!DOCTYPE html>

<body>
    <h2>Une citation</h2>
    <div id="citation">
        <blockquote><strong><p>Nous aurons le destin que nous aurons mérité.</p>
            <cite>Albert Einstein</cite></strong></blockquote>
    </div>
    <script>
        var LaCitation = document.getElementById("citation");
        LaCitation.innerHTML="<strong><blockquote>"+LaCitation.innerHTML+"</blockquote></strong>"; 
        LaCitation.style.color= "blue";
    </script>
</body>

</html>
